[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kt"
version = "0.1.0"
description = "Knowledge tracing on the Riiid dataset: heuristic -> LR -> DKT -> SAKT"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "kaggle>=2"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/kt"]
